<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>VidGnost - 视频知识引擎</title>
    <script>
      // 在首屏绘制前确定主题，避免浅色用户看到深色闪烁。
      // 存储键与取值必须与 apps/desktop/src/stores/theme-store.ts 保持一致。
      ;(function () {
        try {
          var stored = window.localStorage.getItem('vidgnost.theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : null
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = mode || (prefersDark ? 'dark' : 'light')
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.classList.add('dark')
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
